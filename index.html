<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART ASSET PRO UPGRADE</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<!-- 🔥 BARCODE LIB -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
body { font-family: Arial; background:#f4f6f9; }

.qr-grid {
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap:5px;
    padding:5px;
}

.qr-item {
    border:1px dashed #000;
    padding:4px;
    text-align:center;
    font-size:7px;
}

@media print {
    @page { size:A4; margin:5mm; }
}
</style>
</head>

<body class="p-3">

<h3>SMART ASSET PRO (UPGRADE QR + BARCODE)</h3>

<!-- FORM -->
<div class="card p-3 mb-3">
    <input id="namaBarang" class="form-control mb-2" placeholder="Nama Barang">
    
    <select id="kategori" class="form-control mb-2">
        <option>Elektronik</option>
        <option>Mebel & Infrastruktur</option>
        <option>Buku & Pustaka</option>
        <option>Lain-lain</option>
    </select>

    <select id="tahunPerolehan" class="form-control mb-2"></select>

    <input id="noInventaris" class="form-control mb-2" placeholder="Auto Inventaris" readonly>

    <button class="btn btn-primary w-100" onclick="simpan()">Simpan</button>
</div>

<!-- TABLE -->
<table class="table table-bordered">
<thead>
<tr>
<th>Nama</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="tabel"></tbody>
</table>

<button class="btn btn-success" onclick="cetakKolektifTerpilih()">Cetak Terpilih</button>

<div id="printArea" style="display:none;"></div>

<script>
// ================= FIREBASE =================
const firebaseConfig = {
    databaseURL: "https://e-perpus-a652c-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let data = {};

// ================= TAHUN =================
const thn = document.getElementById("tahunPerolehan");
for(let i=2026;i>=2015;i--){
    thn.innerHTML += `<option>${i}</option>`;
}

// ================= INVENTARIS UNIK =================
function generateNoInventarisOtomatis(){
    const nama = document.getElementById("namaBarang").value;
    if(!nama) return;

    const kat = document.getElementById("kategori").value;
    const th = document.getElementById("tahunPerolehan").value;

    const kode = kat.substring(0,3).toUpperCase();
    const unik = Date.now().toString(36) + Math.random().toString(36).substring(2,5);

    document.getElementById("noInventaris").value =
    `INV/${kode}/${th}/${unik}`;
}

document.getElementById("namaBarang").addEventListener("input", generateNoInventarisOtomatis);
document.getElementById("kategori").addEventListener("change", generateNoInventarisOtomatis);
document.getElementById("tahunPerolehan").addEventListener("change", generateNoInventarisOtomatis);

// ================= SIMPAN =================
function simpan(){
    const id = "ASET_" + Date.now();

    db.ref("aset/" + id).set({
        nama: namaBarang.value,
        kategori: kategori.value,
        tahun: tahunPerolehan.value,
        kode: noInventaris.value
    });

    load();
}

// ================= LOAD =================
function load(){
    db.ref("aset").once("value", snap=>{
        data = snap.val() || {};
        render();
    });
}

// ================= RENDER =================
function render(){
    let html = "";
    Object.keys(data).forEach(id=>{
        html += `
        <tr>
            <td>${data[id].nama}</td>
            <td>
                <input type="checkbox" class="chk" value="${id}">
                <button onclick="cetak('${id}')">Print</button>
            </td>
        </tr>`;
    });
    tabel.innerHTML = html;
}

// ================= CETAK INDIVIDU =================
function cetak(id){
    const item = data[id];
    const printArea = document.getElementById("printArea");

    const qrId = "qr_" + id;
    const bcId = "bc_" + id;

    printArea.innerHTML = `
    <div style="width:220px;border:1px solid #000;padding:5px;text-align:center">
        <div style="font-size:10px;font-weight:bold">${item.nama}</div>
        <div id="${qrId}"></div>
        <svg id="${bcId}"></svg>
        <div style="font-size:8px">${item.kode}</div>
    </div>`;

    new QRCode(document.getElementById(qrId), {
        text: item.kode,
        width:50,
        height:50
    });

    JsBarcode("#"+bcId, item.kode, {
        format:"CODE128",
        width:1,
        height:30,
        displayValue:false
    });

    setTimeout(()=>{
        const w = window.open();
        w.document.write(printArea.innerHTML);
        w.print();
    },300);
}

// ================= CETAK KOLEKTIF A4 =================
function cetakKolektifTerpilih(){
    const chk = document.querySelectorAll(".chk");

    const grid = document.createElement("div");
    grid.className = "qr-grid";

    let ada = false;

    chk.forEach((c,i)=>{
        if(c.checked){
            ada = true;
            const item = data[c.value];

            const qr = "q"+i;
            const bc = "b"+i;

            const box = document.createElement("div");
            box.className = "qr-item";

            box.innerHTML = `
                <div>${item.nama}</div>
                <div id="${qr}"></div>
                <svg id="${bc}"></svg>
                <div>${item.kode}</div>
            `;

            grid.appendChild(box);

            setTimeout(()=>{
                new QRCode(document.getElementById(qr), {
                    text:item.kode,
                    width:35,
                    height:35
                });

                JsBarcode("#"+bc, item.kode, {
                    format:"CODE128",
                    width:1,
                    height:25,
                    displayValue:false
                });
            },50);
        }
    });

    if(!ada){
        alert("Pilih data dulu");
        return;
    }

    const printArea = document.getElementById("printArea");
    printArea.innerHTML = "";
    printArea.appendChild(grid);

    setTimeout(()=>{
        const w = window.open();
        w.document.write(`
        <html>
        <head>
        <style>
        @page { size:A4; margin:5mm; }
        body { margin:0; }
        </style>
        </head>
        <body>${printArea.innerHTML}
        <script>
        window.onload=function(){window.print();window.close();}
        <\/script>
        </body>
        </html>`);
        w.document.close();
    },500);
}

// init
load();
</script>

</body>
</html>
